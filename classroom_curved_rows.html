<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Seating Planner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F2EC;--panel-bg:#FDFAF5;--border:#D9D3C7;--text:#2A2218;--muted:#7A7060;
  --accent:#8B5E3C;--accent-l:#C49A6C;--tag:#EDE8DF;--shadow:rgba(60,40,20,.10);
  --fh:'Georgia','Times New Roman',serif;--fb:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:1140px;margin:0 auto;padding:1.5rem 1rem 3rem;display:flex;flex-direction:column;gap:1rem}
h1{font-family:var(--fh);font-size:1.5rem;font-weight:normal;padding-bottom:.5rem;border-bottom:1.5px solid var(--border)}
h1 small{font-size:.75rem;color:var(--muted);margin-left:.75rem;font-family:var(--fb);text-transform:uppercase;letter-spacing:.04em}
.panels{display:grid;grid-template-columns:272px 1fr;gap:1rem;align-items:start}
.panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem;box-shadow:0 2px 8px var(--shadow)}
.pt{font-family:var(--fh);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.85rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sl{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:.9rem 0 .45rem;font-weight:700}
.cg{display:flex;flex-direction:column;gap:2px;margin-bottom:.5rem}
.cg label{font-size:.71rem;color:var(--muted);display:flex;justify-content:space-between}
.cg label .v{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;min-width:24px;text-align:right}
.cg input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.tr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.tr label:first-child{font-size:.71rem;color:var(--muted)}
.tog{position:relative;width:34px;height:18px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:var(--border);border-radius:18px;cursor:pointer;transition:.2s}
.tog-sl::before{content:'';position:absolute;width:12px;height:12px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked+.tog-sl{background:var(--accent)}
.tog input:checked+.tog-sl::before{transform:translateX(16px)}
.rb{font-size:.67rem;padding:3px 9px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.rb:hover{background:var(--tag);color:var(--text)}
.pc{display:flex;flex-direction:column;gap:5px;margin-top:.2rem}
.pb{font-size:.71rem;padding:6px 10px;border:1px solid var(--border);border-radius:5px;background:var(--tag);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;text-align:left}
.pb:hover{border-color:var(--accent-l);background:#EDE0D2}
.pb.active{background:var(--accent);color:white;border-color:var(--accent)}
.pb .ic{font-size:.95rem;line-height:1;min-width:14px;text-align:center}
.il{display:flex;flex-direction:column;gap:3px;max-height:130px;overflow-y:auto;margin-top:.3rem}
.it{font-size:.67rem;background:var(--tag);border:1px solid var(--border);border-radius:4px;padding:3px 6px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.it .del{cursor:pointer;color:#C0604A;font-size:.8rem;padding:0 3px;border-radius:2px}
.it .del:hover{background:#FFE8E4}
.cw{overflow:auto;background:#EAE5DC;border-radius:6px;min-height:340px;display:flex;align-items:flex-start;justify-content:center;padding:1rem;background-image:radial-gradient(circle,#C4BBAC 1px,transparent 1px);background-size:20px 20px}
.stats{display:flex;gap:14px;margin-top:.65rem;flex-wrap:wrap;padding-top:.5rem;border-top:1px solid var(--border)}
.stat{font-size:.69rem;color:var(--muted)}.stat strong{color:var(--text);font-weight:600}
.leg{display:flex;gap:10px;margin-top:.55rem;flex-wrap:wrap;align-items:center;padding-top:.4rem;border-top:1px solid var(--border)}
.li{display:flex;align-items:center;gap:5px;font-size:.67rem;color:var(--muted)}
.ls{width:14px;height:14px;border-radius:2px;border:1px solid var(--border)}
.mh{font-size:.67rem;color:var(--accent);margin-top:.35rem;min-height:1.4em;font-style:italic;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<h1>Classroom Planner <small>Seating Layout</small></h1>
<div class="panels">

<div class="panel" style="display:flex;flex-direction:column;gap:0">
  <div class="pt">Layout Controls <button class="rb" onclick="resetAll()">Reset All</button></div>

  <div class="sl">Seating Grid</div>
  <div class="cg"><label>Rows <span class="v" id="rows-v">4</span></label><input type="range" id="rows" min="1" max="10" value="4" step="1" oninput="sync()"></div>
  <div class="cg"><label>Columns <span class="v" id="cols-v">5</span></label><input type="range" id="cols" min="1" max="12" value="5" step="1" oninput="sync()"></div>
  <div class="cg"><label>Row curve <span class="v" id="curve-v">16</span></label><input type="range" id="curve" min="0" max="50" value="16" step="1" oninput="sync()"></div>
  <div class="cg"><label>H spacing <span class="v" id="gapC-v">10</span>px</label><input type="range" id="gapC" min="4" max="40" value="10" step="1" oninput="sync()"></div>
  <div class="cg"><label>V spacing <span class="v" id="gapR-v">14</span>px</label><input type="range" id="gapR" min="4" max="50" value="14" step="1" oninput="sync()"></div>

  <div class="sl">Options</div>
  <div class="tr"><label for="stagger">Staggered rows</label><label class="tog"><input type="checkbox" id="stagger" onchange="sync()"><span class="tog-sl"></span></label></div>
  <div id="sg" style="display:none"><div class="cg"><label>Stagger offset <span class="v" id="staggerAmt-v">50</span>%</label><input type="range" id="staggerAmt" min="10" max="100" value="50" step="5" oninput="sync()"></div></div>

  <div class="sl">Auto Aisles</div>
  <div class="cg"><label>Vertical aisles <span class="v" id="va-v">1</span></label><input type="range" id="va" min="0" max="5" value="1" step="1" oninput="sync()"></div>

  <div class="sl">Place Elements</div>
  <div class="pc">
    <button class="pb" id="btn-hpath" onclick="setMode('hpath')"><span class="ic">⇆</span>Horizontal pathway</button>
    <button class="pb" id="btn-vpath" onclick="setMode('vpath')"><span class="ic">⇅</span>Vertical pathway</button>
    <button class="pb" id="btn-stair" onclick="setMode('stair')"><span class="ic">▤</span>Staircase (on pathway)</button>
  </div>
  <div class="mh" id="mh">Click seats to toggle occupancy.</div>
  <div id="pi"></div>
</div>

<div class="panel" style="overflow:hidden">
  <div class="pt">Floor Plan <span style="font-size:.67rem;color:var(--muted)">Click to interact</span></div>
  <div class="cw"><canvas id="cv"></canvas></div>
  <div class="leg">
    <div class="li"><div class="ls" style="background:#E8D5C0;border-color:#8B5E3C"></div>Empty</div>
    <div class="li"><div class="ls" style="background:#4A9070;border-color:#1D6045"></div>Occupied</div>
    <div class="li"><div class="ls" style="background:#E0D8CC;border-color:#B0A898"></div>Pathway</div>
    <div class="li"><div class="ls" style="background:#C8BEAC;border-color:#8B7355"></div>Staircase</div>
  </div>
  <div class="stats" id="stats"></div>
</div>

</div>
</div>
<script>
const CW=54,CH=58,TOP=28,SIDE=28,AISLE_V=34,PH=36,PV=36,SH=52;
let seating={},hPaths=new Set(),vPaths=new Set(),stairs=[],mode='seat';
const key=(r,c)=>r+','+c;

function resetAll(){seating={};hPaths=new Set();vPaths=new Set();stairs=[];setMode('seat');draw();rl()}

const HINTS={
  seat:'Click any seat to toggle occupied / empty.',
  hpath:'Click between rows on the canvas to place/remove a horizontal pathway.',
  vpath:'Click between columns on the canvas to place/remove a vertical pathway.',
  stair:'Click on a horizontal pathway to toggle a staircase on it.'
};
function setMode(m){
  mode=m;
  ['hpath','vpath','stair'].forEach(id=>document.getElementById('btn-'+id).classList.toggle('active',id===m));
  document.getElementById('mh').textContent=HINTS[m]||'';
}

function aisle(count,total){
  const s=new Set();if(!count||total<=1)return s;
  const sp=total/(count+1);
  for(let i=1;i<=count;i++)s.add(Math.min(total-1,Math.round(i*sp)-1));
  return s;
}
function curve(c,cols,amt){
  if(cols<=1)return 0;const n=(c/(cols-1))*2-1;return amt*n*n;
}

function buildLayout(){
  const rows=+document.getElementById('rows').value,cols=+document.getElementById('cols').value,
        gapC=+document.getElementById('gapC').value,gapR=+document.getElementById('gapR').value,
        vaC=+document.getElementById('va').value,amt=+document.getElementById('curve').value,
        va=aisle(vaC,cols);
  const colXs=[SIDE];
  for(let c=0;c<cols;c++) colXs.push(colXs[c]+CW+(vPaths.has(c)?PV:(va.has(c)?AISLE_V:gapC)));
  const rowYs=[];let y=TOP;
  if(hPaths.has(-1)) y+=stairs.some(s=>s.after===-1)?SH:PH;
  for(let r=0;r<rows;r++){
    rowYs.push(y);
    if(r<rows-1){y+=CH;if(hPaths.has(r))y+=stairs.some(s=>s.after===r)?SH:PH;else y+=gapR;}
  }
  const totalW=colXs[cols]+SIDE,totalH=(rowYs[rows-1]||TOP)+CH+TOP+amt;
  return{rowYs,colXs,totalW,totalH,rows,cols,amt,va,gapC};
}

function drawArmchair(ctx,x,y,occ){
  const sx=CW/680,sy=CH/720;
  ctx.save();ctx.translate(x,y);ctx.scale(sx,sy);
  const base=occ?'#4A9070':'#E8D5C0',str=occ?'#1D6045':'#5A3E28',
        cush=occ?'#7ABDA0':'#D4B896',legs=occ?'#3A7060':'#CDB898',dsk=occ?'#2E7A58':'#C8B880';
  function P(d){return new Path2D(d)}
  ctx.lineJoin='round';ctx.lineCap='round';
  function fi(p,f,lw){ctx.fillStyle=f;ctx.strokeStyle=str;ctx.lineWidth=lw;ctx.fill(p);ctx.stroke(p)}
  fi(P("M200 430 C192 420 185 360 188 300 C190 245 198 200 210 185 C225 165 255 155 340 152 C425 155 455 165 470 185 C482 200 490 245 492 300 C495 360 488 420 480 430 Z"),base,7);
  fi(P("M200 430 C190 432 168 435 155 438 C138 442 132 450 130 460 C128 472 132 485 140 490 C150 496 170 497 185 495 C200 493 210 488 215 480 C220 470 220 455 218 442 Z"),base,6);
  fi(P("M480 430 C490 432 512 435 525 438 C542 442 548 450 550 460 C552 472 548 485 540 490 C530 496 510 497 495 495 C480 493 470 488 465 480 C460 470 460 455 462 442 Z"),base,6);
  fi(P("M195 440 C195 460 198 490 205 510 C212 528 225 535 340 536 C455 535 468 528 475 510 C482 490 485 460 485 440 Z"),base,7);
  fi(P("M220 440 C218 452 220 468 228 478 C240 490 280 496 340 496 C400 496 440 490 452 478 C460 468 462 452 460 440 C450 430 410 423 340 423 C270 423 230 430 220 440 Z"),cush,5);
  ctx.beginPath();ctx.moveTo(260,464);ctx.quadraticCurveTo(300,458,340,456);ctx.quadraticCurveTo(380,458,420,464);
  ctx.strokeStyle=str;ctx.globalAlpha=.35;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;
  [P("M225 530 C222 545 220 558 218 572 C217 580 220 586 228 587 C237 588 244 583 246 574 C248 560 248 545 246 530 Z"),
   P("M435 530 C438 545 440 558 442 572 C443 580 440 586 432 587 C423 588 416 583 414 574 C412 560 412 545 414 530 Z")
  ].forEach(l=>fi(l,legs,6));
  [[240,220,440,222,2.5,.3],[225,265,455,265,2,.2]].forEach(([x1,y1,x2,y2,lw,a])=>{
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2,(y1+y2)/2-8,x2,y2);
    ctx.strokeStyle=str;ctx.globalAlpha=a;ctx.lineWidth=lw;ctx.stroke();ctx.globalAlpha=1;
  });
  fi(P("M532 418 C530 414 522 410 370 410 C330 410 312 413 308 419 C305 424 306 440 310 445 C314 450 332 453 370 453 C522 453 530 449 532 445 Z"),dsk,5);
  ctx.beginPath();ctx.arc(532,450,5.5,0,Math.PI*2);
  ctx.fillStyle=occ?'#3A8060':'#C8B89A';ctx.fill();ctx.strokeStyle=str;ctx.lineWidth=3.5;ctx.stroke();
  ctx.strokeStyle=str;
  ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(532,450);ctx.bezierCurveTo(525,462,510,472,498,478);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(498,453);ctx.bezierCurveTo(500,464,504,474,510,482);ctx.bezierCurveTo(516,490,524,494,530,486);ctx.stroke();
  [[510,423,360,422],[514,432,358,431],[512,442,360,441]].forEach(([x1,y1,x2,y2],i)=>{
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=str;ctx.globalAlpha=.25-i*.05;ctx.lineWidth=1.5;ctx.stroke();
  });
  ctx.globalAlpha=1;ctx.restore();
}

function drawPathway(ctx,x,y,w,h,lbl){
  ctx.save();
  ctx.fillStyle='#E0D8CC';ctx.fillRect(x,y,w,h);
  ctx.setLineDash([8,6]);ctx.strokeStyle='#C0B8A8';ctx.lineWidth=1;
  ctx.beginPath();
  if(w>h){ctx.moveTo(x+10,y+h/2);ctx.lineTo(x+w-10,y+h/2)}
  else{ctx.moveTo(x+w/2,y+10);ctx.lineTo(x+w/2,y+h-10)}
  ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#B8B0A4';ctx.lineWidth=.8;ctx.strokeRect(x,y,w,h);
  if(lbl){ctx.fillStyle='rgba(100,90,75,.5)';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,x+w/2,y+h/2)}
  ctx.restore();
}

function drawStair(ctx,x,y,w,h){
  const steps=6;ctx.save();
  ctx.fillStyle='rgba(60,40,15,.1)';ctx.fillRect(x+4,y+4,w,h);
  ctx.fillStyle='#D4C8B4';ctx.fillRect(x,y,w,h);
  const sw=w/steps;
  for(let i=0;i<steps;i++){
    ctx.fillStyle=`rgba(80,55,25,${.03+i*.025})`;ctx.fillRect(x+i*sw+1,y+1,sw-2,h-2);
    if(i>0){ctx.strokeStyle='#9B8B70';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+i*sw,y+2);ctx.lineTo(x+i*sw,y+h-2);ctx.stroke()}
    ctx.beginPath();ctx.moveTo(x+i*sw+4,y+4);ctx.lineTo(x+(i+1)*sw-4,y+4);
    ctx.strokeStyle='rgba(255,248,235,.7)';ctx.lineWidth=1.5;ctx.stroke();
  }
  ctx.strokeStyle='#7B6540';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='rgba(70,50,20,.5)';ctx.font=`bold ${Math.min(h*.55,15)}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('▲',x+w/2,y+h/2);
  ctx.restore();
}

let chairPos=[];

function draw(){
  const stOn=document.getElementById('stagger').checked,
        stAmt=+document.getElementById('staggerAmt').value/100;
  document.getElementById('sg').style.display=stOn?'':'none';
  const L=buildLayout();
  const{rowYs,colXs,totalW,totalH,rows,cols,amt,gapC}=L;
  const cv=document.getElementById('cv'),dpr=window.devicePixelRatio||1;
  cv.width=totalW*dpr;cv.height=totalH*dpr;cv.style.width=totalW+'px';cv.style.height=totalH+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,totalW,totalH);

  vPaths.forEach(vc=>{
    const px=colXs[vc+1]-PV;
    drawPathway(ctx,px,TOP-8,PV,totalH-TOP*2+16,'aisle');
  });

  function drawHSlot(r){
    const isS=stairs.some(s=>s.after===r);
    const py=r===-1?TOP:rowYs[r]+CH;
    const pw=colXs[cols]-SIDE;
    if(isS)drawStair(ctx,SIDE,py,pw,SH);
    else drawPathway(ctx,SIDE,py,pw,PH,r===-1?'entrance':'aisle');
  }
  if(hPaths.has(-1))drawHSlot(-1);
  for(let r=0;r<rows-1;r++)if(hPaths.has(r))drawHSlot(r);

  chairPos=[];
  for(let r=0;r<rows;r++){
    const odd=stOn&&(r%2===1),vc=odd?cols-1:cols;
    for(let c=0;c<vc;c++){
      const ox=odd?(CW+gapC)*stAmt:0;
      const cx=colXs[c]+ox,cy=rowYs[r]+curve(c,cols,amt);
      chairPos.push({r,c,cx,cy});
    }
  }
  chairPos.forEach(({r,c,cx,cy})=>drawArmchair(ctx,cx,cy,!!seating[key(r,c)]));

  cv.onclick=function(e){
    const rect=cv.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(totalW/rect.width),my=(e.clientY-rect.top)*(totalH/rect.height);

    if(mode==='seat'){
      for(let i=chairPos.length-1;i>=0;i--){
        const{r,c,cx,cy}=chairPos[i];
        if(mx>=cx&&mx<=cx+CW&&my>=cy&&my<=cy+CH){seating[key(r,c)]=!seating[key(r,c)];draw();return}
      }
      return;
    }
    if(mode==='hpath'){
      if(my<rowYs[0]){
        hPaths.has(-1)?hPaths.delete(-1):hPaths.add(-1);
        if(!hPaths.has(-1))stairs=stairs.filter(s=>s.after!==-1);
        draw();rl();setMode('seat');return;
      }
      for(let r=0;r<rows-1;r++){
        if(my>=rowYs[r]+CH&&my<=rowYs[r+1]){
          hPaths.has(r)?hPaths.delete(r):hPaths.add(r);
          if(!hPaths.has(r))stairs=stairs.filter(s=>s.after!==r);
          draw();rl();setMode('seat');return;
        }
      }
      return;
    }
    if(mode==='vpath'){
      for(let c=0;c<cols-1;c++){
        if(mx>=colXs[c]+CW&&mx<=colXs[c+1]){
          vPaths.has(c)?vPaths.delete(c):vPaths.add(c);
          draw();rl();setMode('seat');return;
        }
      }
      return;
    }
    if(mode==='stair'){
      let hit=false;
      if(hPaths.has(-1)&&my<rowYs[0]){
        const i=stairs.findIndex(s=>s.after===-1);i>=0?stairs.splice(i,1):stairs.push({after:-1});hit=true;
      }
      if(!hit){
        for(let r=0;r<rows-1;r++){
          if(hPaths.has(r)&&my>=rowYs[r]+CH&&my<=rowYs[r+1]+SH){
            const i=stairs.findIndex(s=>s.after===r);i>=0?stairs.splice(i,1):stairs.push({after:r});hit=true;break;
          }
        }
      }
      if(hit){draw();rl();setMode('seat')}
      else{document.getElementById('mh').textContent='Add a horizontal pathway first, then click on it.'}
      return;
    }
  };

  const tot=chairPos.length,occ=Object.values(seating).filter(Boolean).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat">Seats <strong>${tot}</strong></div>
    <div class="stat">Occupied <strong>${occ}</strong></div>
    <div class="stat">Empty <strong>${tot-occ}</strong></div>
    <div class="stat">Occupancy <strong>${tot?Math.round(occ/tot*100):0}%</strong></div>
    <div class="stat">Pathways <strong>${hPaths.size+vPaths.size}</strong></div>
    <div class="stat">Staircases <strong>${stairs.length}</strong></div>`;
}

function rl(){
  const rows=+document.getElementById('rows').value;
  let h='';
  const ha=[...hPaths].sort((a,b)=>a-b);
  if(ha.length){
    h+='<div class="sl" style="margin-top:.6rem">H Pathways</div><div class="il">';
    ha.forEach(r=>{
      const lbl=r===-1?'Before row 1':`After row ${r+1}`;
      const isS=stairs.some(s=>s.after===r);
      h+=`<div class="it"><span>↔ ${lbl}${isS?' + stairs':''}</span><span class="del" onclick="rmH(${r})">✕</span></div>`;
    });
    h+='</div>';
  }
  const va=[...vPaths].sort((a,b)=>a-b);
  if(va.length){
    h+='<div class="sl" style="margin-top:.6rem">V Pathways</div><div class="il">';
    va.forEach(c=>{h+=`<div class="it"><span>↕ After col ${c+1}</span><span class="del" onclick="rmV(${c})">✕</span></div>`});
    h+='</div>';
  }
  if(stairs.length){
    h+='<div class="sl" style="margin-top:.6rem">Staircases</div><div class="il">';
    stairs.forEach((s,i)=>{
      const lbl=s.after===-1?'Before row 1':`After row ${s.after+1}`;
      h+=`<div class="it"><span>▤ ${lbl}</span><span class="del" onclick="rmS(${i})">✕</span></div>`;
    });
    h+='</div>';
  }
  document.getElementById('pi').innerHTML=h;
}

function rmH(r){hPaths.delete(r);stairs=stairs.filter(s=>s.after!==r);draw();rl()}
function rmV(c){vPaths.delete(c);draw();rl()}
function rmS(i){stairs.splice(i,1);draw();rl()}

function sync(){
  ['rows','cols','va','curve','gapC','gapR','staggerAmt'].forEach(id=>{
    const el=document.getElementById(id),vEl=document.getElementById(id+'-v');
    if(el&&vEl)vEl.textContent=el.value;
  });
  const cols=+document.getElementById('cols').value,rows=+document.getElementById('rows').value;
  const va=document.getElementById('va');
  va.max=Math.max(0,cols-1);
  if(+va.value>+va.max){va.value=va.max;document.getElementById('va-v').textContent=va.max}
  hPaths.forEach(r=>{if(r!==-1&&r>=rows-1){hPaths.delete(r);stairs=stairs.filter(s=>s.after!==r)}});
  vPaths.forEach(c=>{if(c>=cols-1)vPaths.delete(c)});
  draw();rl();
}

setMode('seat');draw();rl();
