<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom viewer</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F5F2EC;--panel-bg:rgba(253,250,245,.92);--tag:#EDE8DF;--border:#D9D3C7;--text:#2A2218;--muted:#7A7060;
      --accent:#8B5E3C;--accent-l:#C49A6C;--shadow:rgba(60,40,20,.12);
      --fh:'Georgia','Times New Roman',serif;--fb:'Helvetica Neue',Helvetica,Arial,sans-serif;
      --err:#C0604A;--hud-bg:rgba(245,242,236,.88);
      --ease-out:cubic-bezier(.22,1,.36,1);
      --dur-enter:.42s;
      --dur-short:.22s;
    }
    @keyframes shell-rise{
      from{opacity:0;transform:translateY(-6px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes empty-pop{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes canvas-in{
      from{opacity:0;transform:scale(.985)}
      to{opacity:1;transform:scale(1)}
    }
    @keyframes dragover-pulse{
      0%,100%{background-color:rgba(237,224,210,.35);outline-color:var(--accent-l)}
      50%{background-color:rgba(237,224,210,.52);outline-color:var(--accent)}
    }
    @keyframes hud-in{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    @media (prefers-reduced-motion:reduce){
      .app>.banner,.app>.floor,.empty-msg:not([hidden]),#cv:not([hidden]),#hud:not([hidden]),.canvas-wrap.dragover{
        animation:none!important
      }
      .btn-open{transition-duration:.01ms!important}
      .status{transition-duration:.01ms!important}
    }
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--fb);background:var(--bg);color:var(--text)}
    .app{display:flex;flex-direction:column;height:100%;min-height:100dvh}
    .app>.banner{
      animation:shell-rise var(--dur-enter) var(--ease-out) both
    }
    .app>.floor{
      animation:shell-rise var(--dur-enter) var(--ease-out) .06s both
    }
    .banner{
      flex-shrink:0;display:flex;align-items:center;gap:.65rem 1rem;flex-wrap:wrap;
      padding:.45rem .85rem;border-bottom:1px solid var(--border);
      background:var(--panel-bg);backdrop-filter:blur(8px);
      box-shadow:inset 3px 0 0 var(--accent-l),0 1px 0 rgba(255,255,255,.6) inset
    }
    .banner-title{font-family:var(--fh);font-size:1.05rem;font-weight:normal;line-height:1.2}
    .banner-title small{font-size:.62rem;color:var(--muted);margin-left:.5rem;font-family:var(--fb);text-transform:uppercase;letter-spacing:.04em}
    .banner-meta{flex:1;min-width:0;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
    .layout-name{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(42vw,280px)}
    .layout-name:not(:empty){color:var(--text)}
    .status{
      font-size:.65rem;color:var(--muted);line-height:1.3;flex:1;min-width:120px;
      transition:color var(--dur-short) var(--ease-out)
    }
    .status.err{color:var(--err)}
    .btn-open{
      flex-shrink:0;font-size:.65rem;padding:.38rem .7rem;border:1px solid var(--border);border-radius:7px;
      background:var(--tag);color:var(--text);cursor:pointer;font-family:var(--fb);
      transition:background .18s var(--ease-out),border-color .18s var(--ease-out),color .18s var(--ease-out),
        transform .18s var(--ease-out),box-shadow .18s var(--ease-out)
    }
    .btn-open:hover:not(:disabled){
      border-color:var(--accent-l);background:#EDE0D2;color:var(--text);
      transform:translateY(-1px);box-shadow:0 3px 10px var(--shadow)
    }
    .btn-open:active:not(:disabled){
      transform:translateY(0);box-shadow:0 1px 4px var(--shadow)
    }
    .btn-open:focus-visible{outline:2px solid var(--accent-l);outline-offset:2px}
    .btn-open:disabled{opacity:.45;cursor:not-allowed}
    .btn-open[aria-pressed="true"]{background:#EDE0D2;border-color:var(--accent-l);color:var(--text)}
    #fileInput{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-99px}
    .floor{
      flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
      background-color:#EAE5DC;
      background-image:radial-gradient(circle,#C4BBAC 1px,transparent 1px);
      background-size:20px 20px;background-attachment:fixed
    }
    .floor::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 90% 75% at 50% 42%,transparent 50%,rgba(90,62,40,.045) 100%)
    }
    .canvas-wrap,.hud{position:relative;z-index:1}
    .canvas-wrap{
      flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:6px;
      overflow:hidden
    }
    .canvas-wrap.is-empty{cursor:default}
    .canvas-wrap.dragover{
      outline:2px dashed var(--accent-l);outline-offset:-4px;background-color:rgba(237,224,210,.35);
      animation:dragover-pulse 1.1s ease-in-out infinite
    }
    .empty-msg{
      font-size:.78rem;color:var(--muted);text-align:center;line-height:1.55;padding:1rem 1.5rem;
      width:100%;margin:0;box-sizing:border-box;pointer-events:none
    }
    .empty-msg:not([hidden]){
      animation:empty-pop .55s var(--ease-out) .14s both
    }
    #cv{display:block;flex-shrink:0}
    #cv:not([hidden]){
      animation:canvas-in .45s var(--ease-out) both
    }
    .hud{
      flex-shrink:0;pointer-events:none;
      display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.55rem 1.1rem;
      padding:.45rem .85rem .58rem;
      background:var(--hud-bg);backdrop-filter:blur(6px);
      border-top:1px solid var(--border);box-shadow:0 -4px 16px var(--shadow)
    }
    .hud[hidden]{display:none!important}
    #hud:not([hidden]){
      animation:hud-in .38s var(--ease-out) both
    }
    .leg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .li{
      display:flex;align-items:center;gap:6px;font-size:.62rem;color:var(--muted);
      padding:.22rem .5rem .22rem .35rem;background:var(--panel-bg);border:1px solid var(--border);
      border-radius:999px;box-shadow:0 1px 4px rgba(60,40,20,.08)
    }
    .ls{width:12px;height:12px;border-radius:2px;border:1px solid var(--border);flex-shrink:0}
    .stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .stat{font-size:.62rem;color:var(--muted)}.stat strong{color:var(--text);font-weight:600}
  </style>
</head>
<body>
<div class="app">
  <header class="banner">
    <h1 class="banner-title">Classroom viewer <small>Read-only</small></h1>
    <div class="banner-meta">
      <span class="layout-name" id="layoutTitle" aria-live="polite"></span>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json,.classroom.json" aria-label="Choose classroom JSON file">
    <button type="button" class="btn-open" id="btnPick" title="Planner export: .classroom.json">Open layout…</button>
    <button type="button" class="btn-open" id="btnSeatLabels" disabled aria-pressed="false" title="Show or hide seat codes (e.g. A-1) on each seat">Seat labels</button>
  </header>

  <main class="floor" id="floor" aria-label="Floor plan area. Drop a layout file here.">
    <div class="canvas-wrap is-empty" id="canvasWrap">
      <canvas id="cv" hidden aria-label="Floor plan canvas"></canvas>
      <p class="empty-msg" id="emptyMsg">Drop a <code>.classroom.json</code> file here or use <strong>Open layout…</strong> in the bar.</p>
    </div>
    <div class="hud" id="hud" hidden>
      <div class="leg" id="legend">
        <div class="li"><div class="ls" style="background:#E8D5C0;border-color:#8B5E3C"></div>Seat</div>
        <div class="li"><div class="ls" style="background:#E0D8CC;border-color:#B0A898"></div>Aisle</div>
        <div class="li"><div class="ls" style="background:#C8BEAC;border-color:#8B7355"></div>Stair aisle</div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </main>
</div>
<script src="classroom-viewer.js"></script>
</body>
</html>
