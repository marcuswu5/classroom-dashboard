  <path stroke-width="7" d="M200 430&#10;       C192 420 185 360 188 300&#10;       C190 245 198 200 210 185&#10;       C225 165 255 155 340 152&#10;       C425 155 455 165 470 185&#10;       C482 200 490 245 492 300&#10;       C495 360 488 420 480 430&#10;       Z" style="fill:rgb(232, 213, 196);stroke:rgb(45, 32, 22);color:rgb(0, 0, 0);stroke-width:7px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

