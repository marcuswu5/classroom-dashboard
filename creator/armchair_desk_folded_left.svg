  <path fill="none" stroke="#2D2016" stroke-width="1.5" stroke-linecap="round" opacity="0.15" d="M512 442 C470 440 420 440 360 441" style="fill:none;stroke:rgb(45, 32, 22);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.15;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

