# Render Blueprint: https://render.com/docs/blueprint-spec
# After first deploy, set GOOGLE_CLIENT_* in the dashboard to match your public URL.

databases:
  - name: classroom-db
    plan: free

services:
  - type: web
    name: classroom-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: classroom-db
          property: connectionString
